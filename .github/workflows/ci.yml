name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        env:
          # Install playwright-core only; never download browser binaries in CI.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: npm install

      - name: Syntax check lib/index.js
        run: node --check lib/index.js

      - name: Syntax check lib/page-snippet.js
        run: node --check lib/page-snippet.js

      # Unit tests must not depend on the network or a real browser. Any e2e
      # coverage is gated behind an environment variable and skipped by CI.
      - name: Run unit tests
        run: npm test
